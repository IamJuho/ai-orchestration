name: Policy

on:
  push:
    branches:
      - main
      - poc/**
      - feature/**
      - fix/**
  pull_request:

jobs:
  repo-facing-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repo-facing files do not expose AI authorship
        run: |
          set -euo pipefail
          if grep -RInE 'Generated with|Generated by AI|AI-generated|Co-authored-by: .*Sisyphus|Co-authored-by: .*ChatGPT' \
            README.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md 2>/dev/null; then
            echo "Forbidden AI attribution phrase found in repo-facing files."
            exit 1
          fi

      - name: Verify new push commit subjects are not English-only and do not expose AI authorship
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if printf '%s' "$subject" | grep -Eiq 'Generated with|Generated by AI|AI-generated|Co-authored-by:'; then
              echo "Forbidden AI attribution phrase found in commit subject: $subject"
              exit 1
            fi
            if ! printf '%s' "$subject" | grep -q '[가-힣]'; then
              echo "Commit subject should be Korean-first and not English-only: $subject"
              exit 1
            fi
          done < <(git log --format='%s' "$RANGE")

      - name: Verify PR title/body structure and wording
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          TEXT="$PR_TITLE"
          TEXT+=$'\n'
          TEXT+="$PR_BODY"

          if printf '%s' "$TEXT" | grep -Eiq 'Generated with|Generated by AI|AI-generated|Co-authored-by:'; then
            echo "Forbidden AI attribution phrase found in PR metadata."
            exit 1
          fi

          if ! printf '%s' "$TEXT" | grep -q '[가-힣]'; then
            echo "PR title/body should not be English-only."
            exit 1
          fi

          for section in '## 요약' '## 전체 흐름 / End-to-end flow' '## 테스트 / Verification' '## 범위와 비목표 / Scope & Non-goals'; do
            if ! printf '%s' "$PR_BODY" | grep -Fq "$section"; then
              echo "Missing required PR section: $section"
              exit 1
            fi
          done
